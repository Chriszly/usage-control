version: 2
updates:
  # Keep the actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Angular supports a fixed range of TypeScript versions; a new TypeScript
      # major comes in with the Angular upgrade that supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "angular-eslint"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
