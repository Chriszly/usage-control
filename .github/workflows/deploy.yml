name: Deploy to Pi

# Runs only when you start it under Actions > "Deploy to Pi" > Run workflow, on
# a self-hosted runner on the Pi (setup: README.md, "Deploy from GitHub"). It
# pulls the published image and (re)starts the container with compose.yaml.
on:
  workflow_dispatch:
    inputs:
      pi:
        description: 'Runner label of the Pi'
        required: true
        default: pi5
      image_tag:
        description: 'Image to deploy: main (latest commit on main) or a version such as 1.2.3'
        required: true
        default: main
      port:
        description: 'Port on the Pi where the website is reachable'
        required: true
        default: '8080'

permissions:
  contents: read
  # Pull the image from the GitHub Container Registry, also while it is private.
  packages: read

concurrency:
  group: deploy-${{ inputs.pi }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy usage-control to ${{ inputs.pi }}
    runs-on: [self-hosted, '${{ inputs.pi }}']
    timeout-minutes: 15
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      PORT: ${{ inputs.port }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: compose.yaml
          sparse-checkout-cone-mode: false

      - name: Check the inputs
        run: |
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]] || { echo "::error::image_tag '$IMAGE_TAG' is not a Docker tag"; exit 1; }
          if ! [[ "$PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( PORT > 65535 )); then
            echo "::error::port '$PORT' is not a port number"; exit 1
          fi

      # A fixed folder, so "docker compose" also works there by hand.
      - name: Install compose.yaml and settings in ~/usage-control
        run: |
          dir="$HOME/usage-control"
          install -m 0755 -d "$dir"
          install -m 0644 compose.yaml "$dir/compose.yaml"
          printf 'PORT=%s\nIMAGE_TAG=%s\n' "$PORT" "$IMAGE_TAG" > "$dir/.env"
          echo "DEPLOY_DIR=$dir" >> "$GITHUB_ENV"
          # Registry login for this job only, deleted at the end.
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"

      - name: Log in to the GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull the image and start the container
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose pull
          docker compose up -d --no-build --remove-orphans
          docker compose ps

      - name: Check the website answers
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          for _ in $(seq 30); do
            if curl -fsS -o /dev/null "http://localhost:$PORT/api/metrics"; then
              echo "usage-control is up on port $PORT"
              exit 0
            fi
            sleep 1
          done
          docker compose logs --tail 50
          echo "::error::usage-control does not answer on http://localhost:$PORT/api/metrics"
          exit 1

      - name: Log out of the registry
        if: always()
        run: rm -rf "$RUNNER_TEMP/docker-config"
