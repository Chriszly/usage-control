name: Demo page

# Publishes the demo of the page to GitHub Pages: the real page, built with
# `npm run build:demo`, with made-up devices instead of a backend. The site is
# the gh-pages branch, which GitHub Pages serves as it is. A release tag
# replaces its root (https://chriszly.github.io/usage-control/) and a change to
# main replaces main/ (https://chriszly.github.io/usage-control/main/); each
# leaves the other alone. Pull requests only build the demo, in the CI workflow.
#
# Releases run on the tag push, as the other release workflows do, not on the
# published release: a release they create with the workflow token starts no
# other workflow, and a release published on GitHub with a new tag pushes the
# tag too, so the release event would publish the same demo a second time.
# A pre-release keeps the root as it is; when it is later made a full release,
# run this workflow by hand on its tag. So does a bugfix on an older line, such
# as 1.0.5 after 1.1.0: the root shows the newest release.
on:
  push:
    branches:
      - main
    # A release tag, with or without the v: v1.2.3 or 1.2.3. Pushing a tag
    # runs the workflow whatever the paths below say.
    tags:
      - 'v*.*.*'
      - '[0-9]*.[0-9]*.[0-9]*'
    paths:
      - 'frontend/**'
      - '.github/workflows/demo.yml'
  # Run on main to rebuild the main demo, or on a release tag to rebuild the
  # release demo from it.
  workflow_dispatch:

permissions:
  contents: read

# One change to each part of the gh-pages branch at a time; a newer one waits
# instead of cancelling a running one. Releases and main have groups of their
# own, so a merge to main never cancels a release run that waits.
concurrency:
  group: pages-${{ github.ref_type }}
  cancel-in-progress: false

jobs:
  # The root shows the newest release. A release marked as a pre-release on
  # GitHub is not the latest release, and a tag older than the newest release,
  # such as a bugfix 1.0.5 after 1.1.0, is not the newest, so both keep the root
  # as it is. A tag without a release yet is one the other release workflows
  # are about to release, which they do as a full release.
  release:
    name: Check the release
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - name: Look up the tag's release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          skip=false
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease 2> error.txt)"; then
              :
            elif grep -q 'release not found' error.txt; then
              prerelease=false
            else
              cat error.txt >&2
              echo "Could not look up the release of $TAG, so it is unclear whether it is a pre-release; run the Demo page workflow again on the tag." >&2
              exit 1
            fi
            if [[ "$prerelease" == true ]]; then
              echo "The release $TAG is a pre-release; the demo at the root stays as it is."
              skip=true
            else
              if ! releases="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName')"; then
                echo "Could not list the releases, so it is unclear whether $TAG is the newest; run the Demo page workflow again on the tag." >&2
                exit 1
              fi
              newest="$(printf '%s\n' "$releases" "$TAG" | sed -e 's/^v//' -e '/^$/d' | sort -V | tail -n 1)"
              if [[ "$newest" != "${TAG#v}" ]]; then
                echo "$TAG is older than the release $newest; the demo at the root stays as it is."
                skip=true
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish the demo
    needs: release
    if: ${{ needs.release.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: source/frontend/.nvmrc
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - name: Build the demo
        working-directory: source/frontend
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            # Fails on a tag that is no release version, such as a
            # pre-release v1.2.3-rc1, as the other release workflows do.
            if [[ ! "${TAG#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+[a-z]*$ ]]; then
              echo "Tag $TAG is not a release version; use v<major>.<minor>.<patch>, such as v1.2.3, with letters for bugfixes, such as 1.2.3a (the v is optional). Pre-release tags such as v1.2.3-rc1 are not supported." >&2
              exit 1
            fi
          fi
          npm ci
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            npm run build:demo -- --base-href /usage-control/ --define "DEMO_RELEASE=\"${TAG#v}\""
          else
            commit="$(git rev-parse --short HEAD)"
            npm run build:demo -- --base-href /usage-control/main/ --define "DEMO_COMMIT=\"${commit}\""
          fi

      - name: Check out the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet site
          cd site
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --quiet --depth 1 origin gh-pages; then
            git checkout --quiet -b gh-pages FETCH_HEAD
          else
            git checkout --quiet --orphan gh-pages
          fi

      - name: Replace this demo's part of the site
        working-directory: site
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            # The release is everything at the root except main/.
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name main -exec rm -rf {} +
            cp -r ../source/frontend/dist/demo/. .
          else
            rm -rf main
            cp -r ../source/frontend/dist/demo main
          fi
          # Serve the files as they are, without Jekyll.
          touch .nojekyll

      - name: Publish the site
        working-directory: site
        env:
          WHAT: ${{ github.ref_type == 'tag' && format('release {0}', github.ref_name) || format('main {0}', github.sha) }}
        run: |
          set -euo pipefail
          git add --all
          if git diff --cached --quiet; then
            echo "The demo of ${WHAT} is already published."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m "Publish the demo of ${WHAT}"
          # The release and the main demo publish at the same time, to
          # different paths (the root and main/), so a push the other one got
          # in first is put on top of it and tried again.
          for attempt in 1 2 3 4 5; do
            if git push --quiet origin gh-pages; then
              exit 0
            fi
            if [[ "$attempt" == 5 ]]; then
              break
            fi
            echo "gh-pages changed while publishing (attempt ${attempt}); putting the demo on top of it."
            sleep "$attempt"
            git fetch --quiet origin gh-pages
            git rebase --quiet FETCH_HEAD
          done
          echo "Could not push the demo of ${WHAT} to gh-pages after 5 attempts; run the Demo page workflow again." >&2
          exit 1
