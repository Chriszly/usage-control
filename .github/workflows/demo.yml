name: Demo page

# Publishes the demo of the page to GitHub Pages: the real page, built with
# `npm run build:demo`, with made-up devices instead of a backend. The latest
# release is at https://chriszly.github.io/usage-control/ and main at
# https://chriszly.github.io/usage-control/main/. Every run builds both, so a
# new release and a change to main each publish the whole site. Pull requests
# only build the demo, in the CI workflow.
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/demo.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one waits instead of cancelling a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main

      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: release

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: main/frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            main/frontend/package-lock.json
            release/frontend/package-lock.json

      - name: Build the latest release at the root
        working-directory: release/frontend
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! -f src/demo/main.ts ]]; then
            echo "Release ${TAG} has no demo (src/demo/main.ts); publish a newer release first." >&2
            exit 1
          fi
          npm ci
          npm run build:demo -- --base-href /usage-control/ --define "DEMO_RELEASE=\"${TAG#v}\""

      - name: Build main under main/
        working-directory: main/frontend
        run: |
          set -euo pipefail
          npm ci
          commit="$(git rev-parse --short HEAD)"
          npm run build:demo -- --base-href /usage-control/main/ --define "DEMO_COMMIT=\"${commit}\""

      - name: Put both into one site
        run: |
          set -euo pipefail
          mkdir site
          cp -r release/frontend/dist/demo/. site/
          cp -r main/frontend/dist/demo site/main

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
