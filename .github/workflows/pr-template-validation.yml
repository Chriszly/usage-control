name: PR Template Validation

on:
  pull_request:
    types: [opened, edited, synchronize]
  # The nightly "Vulnerability fixes" workflow starts this on its branch: a pull
  # request it opens starts no workflows of its own.
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  validate-pr-template:
    # Dependabot writes its own PR description, not ours. Skipping the job
    # (rather than not running the workflow) still reports this required check
    # as passed, so Dependabot PRs can merge once the rest of CI is green.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body matches template
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let pr = context.payload.pull_request;
            if (!pr) {
              const branch = context.ref.replace('refs/heads/', '');
              const { data } = await github.rest.pulls.list({
                ...context.repo,
                head: `${context.repo.owner}:${branch}`,
                state: 'open'
              });
              pr = data[0];
              if (!pr) {
                core.setFailed(`No open pull request for the branch ${branch}.`);
                return;
              }
            }
            const body = pr.body || '';
            const requiredSections = [
              '## Summary',
              '## Type of change',
              '## Checklist',
              '## Testing'
            ];

            const heading = (section) => new RegExp(`^${section}(?: |\r?$|:|\n)`, 'm');
            const missing = requiredSections.filter(section => !heading(section).test(body));

            if (missing.length > 0) {
              core.setFailed(`PR description is missing required sections: ${missing.join(', ')}. Please use the PR template.`);
            } else {
              console.log('PR template validation passed.');
            }
