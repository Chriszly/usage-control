name: Windows installer

# Builds the Windows programs (the service and the tray icon) and runs the
# Windows-only tests on every pull request. The installers
# (usage-control-<version>-x64.msi and -arm64.msi) are built on main, on
# version tags, and on pull requests that change the installer or the tray
# icon (windows/, this workflow, backend/cmd/usage-control-tray or
# backend/cmd/tray-icons); that job also checks on a Windows machine that the
# x64 one installs, starts the service and the tray icon and keeps its options
# across an update (windows/check-installer.ps1). Main keeps the installers as
# a workflow artifact; a version tag (v1.2.3 or 1.2.3) also attaches them to
# that GitHub release.
on:
  pull_request:
  push:
    branches:
      - main
    # A release tag, with or without the v: v1.2.3 or 1.2.3.
    tags:
      - 'v*.*.*'
      - '[0-9]*.[0-9]*.[0-9]*'
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  # Only cancel superseded PR runs; let pushes to main and tags finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Go cross-compiles for Windows, so the website and the programs are built on
  # Linux, which is faster than on a Windows runner.
  programs:
    name: Windows programs (x64 and arm64)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer: ${{ steps.changes.outputs.installer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as a merge commit; its first parent
          # is the base branch, so the PR's changes are the diff to HEAD^1.
          fetch-depth: 2

      # Pull requests only build the installers when they change them or the
      # tray icon they install.
      - name: Does this change the installer
        id: changes
        run: |
          set -euo pipefail
          installer=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] &&
            ! git diff --name-only HEAD^1 HEAD | grep -qE '^(windows/|\.github/workflows/windows\.yml$|backend/cmd/(usage-control-tray|tray-icons)/)'; then
            installer=false
          fi
          echo "installer=$installer" >> "$GITHUB_OUTPUT"

      # A tag v1.2.3 builds version 1.2.3; anything else 0.0.<run number>, so
      # every newer build can be installed over an older one.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag $GITHUB_REF_NAME is not a version the installer accepts; use v<major>.<minor>.<patch>, such as v1.2.3 (the v is optional)." >&2
              exit 1
            fi
          else
            version="0.0.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Writes the website into backend/internal/web/files/build, which the
      # programs embed for the installer's WEBSITE=1 option.
      - name: Build the website
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The tray icon is the website's mascot in the colors of the theme just
      # built; the plain one is the installer's icon.
      - name: Draw the tray icons
        working-directory: backend
        run: |
          set -euo pipefail
          go run ./cmd/tray-icons
          mkdir -p ../dist
          cp cmd/usage-control-tray/icons/usage-control.ico ../dist/

      # The tray program is a windowless GUI program, so no console opens with
      # it. The test program runs the Windows-only tests on the Windows runner.
      - name: Build the programs
        working-directory: backend
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" \
              go build -trimpath \
                -ldflags="-s -w -X github.com/Chriszly/usage-control/backend/internal/version.Version=$VERSION" \
                -o "../dist/$arch/usage-control.exe" ./cmd/usage-control
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -H=windowsgui" \
                -o "../dist/$arch/usage-control-tray.exe" ./cmd/usage-control-tray
          done
          GOOS=windows GOARCH=amd64 go test -c -o ../dist/tests/usage-control-tests.exe ./cmd/usage-control
          GOOS=windows GOARCH=amd64 go test -c -o ../dist/tests/metrics-tests.exe ./internal/metrics

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-programs
          path: dist/
          retention-days: 1

  tests:
    name: Windows tests
    needs: programs
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-programs
          path: dist

      - name: Run the Windows-only tests
        run: |
          # Quoted: PowerShell would split -test.v into -test and .v.
          dist\tests\usage-control-tests.exe '-test.v'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Only the GPU tests: the other metrics tests assume Linux paths.
          dist\tests\metrics-tests.exe '-test.v' '-test.run=GPU'
          if ($LASTEXITCODE -ne 0) { exit 1 }

  installer:
    name: Windows installer (x64 and arm64)
    needs: [programs, tests]
    if: needs.programs.outputs.installer == 'true'
    runs-on: windows-latest
    # TEMPORARY, removed before merge: lets the screenshot step push.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.programs.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-programs
          path: dist

      # WiX 5 is the last WiX release under the MS-RL license; later versions
      # need the Open Source Maintenance Fee EULA accepted.
      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.Firewall.wixext/5.0.2 WixToolset.Util.wixext/5.0.2 WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build the installers
        run: |
          foreach ($arch in @{ x64 = 'amd64'; arm64 = 'arm64' }.GetEnumerator()) {
            wix build windows\usage-control.wxs -arch $arch.Key `
              -d Version=$env:VERSION -d Binary=dist\$($arch.Value)\usage-control.exe `
              -d TrayBinary=dist\$($arch.Value)\usage-control-tray.exe -d Icon=dist\usage-control.ico `
              -ext WixToolset.Firewall.wixext -ext WixToolset.Util.wixext -ext WixToolset.UI.wixext `
              -o "msi\usage-control-$env:VERSION-$($arch.Key).msi"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Get-ChildItem msi

      # The check updates to a newer version, so it also gets an installer
      # with the next patch version, which is not published.
      - name: Install, update and uninstall it
        run: |
          $version = [version]$env:VERSION
          $newer = "$($version.Major).$($version.Minor).$($version.Build + 1)"
          wix build windows\usage-control.wxs -arch x64 `
            -d Version=$newer -d Binary=dist\amd64\usage-control.exe `
            -d TrayBinary=dist\amd64\usage-control-tray.exe -d Icon=dist\usage-control.ico `
            -ext WixToolset.Firewall.wixext -ext WixToolset.Util.wixext -ext WixToolset.UI.wixext `
            -o "check\usage-control-$newer-x64.msi"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          windows\check-installer.ps1 -Msi "msi\usage-control-$env:VERSION-x64.msi" -NewerMsi "check\usage-control-$newer-x64.msi"

      # TEMPORARY, removed before merge: screenshots of the tray icon for the PR.
      - name: Screenshot the tray icon
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -Namespace Win32 -Name Shot -MemberDefinition @'
          [StructLayout(LayoutKind.Sequential)] public struct Rect { public int Left, Top, Right, Bottom; }
          [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
          [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr window, out Rect rect);
          [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string className, string windowName);
          [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr window, uint message, IntPtr wParam, IntPtr lParam);
          [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
          '@
          New-Item -ItemType Directory shots -Force | Out-Null
          function Save-Area([string] $Name, [int] $X, [int] $Y, [int] $Width, [int] $Height) {
            $bitmap = New-Object System.Drawing.Bitmap $Width, $Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($X, $Y, 0, 0, $bitmap.Size)
            $bitmap.Save("shots\$Name.png")
          }
          function Save-Window([string] $Name) {
            $rect = New-Object Win32.Shot+Rect
            $null = [Win32.Shot]::GetWindowRect([Win32.Shot]::GetForegroundWindow(), [ref]$rect)
            Save-Area $Name $rect.Left $rect.Top ($rect.Right - $rect.Left) ($rect.Bottom - $rect.Top)
          }
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          function Save-Menu([string] $Name) {
            $null = [Win32.Shot]::SetCursorPos($screen.Width - 300, $screen.Height - 80)
            $window = [Win32.Shot]::FindWindow('SystrayClass', '')
            $null = [Win32.Shot]::PostMessage($window, 0x0401, [IntPtr]::Zero, [IntPtr]0x0205)
            Start-Sleep -Seconds 2
            Save-Area $Name ($screen.Width - 700) ($screen.Height - 420) 700 420
            $shell.SendKeys('{ESC}')
            Start-Sleep -Seconds 1
          }

          # The wizard to its last page, then Finish with the box ticked.
          $msi = (Resolve-Path "msi\usage-control-$env:VERSION-x64.msi").Path
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`""
          Start-Sleep -Seconds 10
          $shell = New-Object -ComObject WScript.Shell
          $null = $shell.AppActivate('Usage Control Setup')
          Start-Sleep -Seconds 1
          $shell.SendKeys('{ENTER}')
          Start-Sleep -Seconds 2
          $shell.SendKeys('{ENTER}')
          Start-Sleep -Seconds 2
          $shell.SendKeys('{ENTER}')
          Start-Sleep -Seconds 30
          $null = $shell.AppActivate('Usage Control Setup')
          Start-Sleep -Seconds 1
          Save-Window finish
          $shell.SendKeys('{ENTER}')
          Start-Sleep -Seconds 8
          Get-Process usage-control-tray | Format-Table Id, ProcessName
          Save-Area taskbar ($screen.Width - 600) ($screen.Height - 80) 600 80
          Save-Menu menu-no-hub
          # A hub asks this PC for its usage.
          $null = Invoke-WebRequest http://127.0.0.1:9393/api/metrics -Headers @{ 'Usage-Control-Hub-Port' = '9393' } -UseBasicParsing
          Start-Sleep -Seconds 7
          Save-Menu menu-running
          $window = [Win32.Shot]::FindWindow('SystrayClass', '')
          $null = [Win32.Shot]::PostMessage($window, 0x0111, [IntPtr]7, [IntPtr]::Zero)
          Start-Sleep -Seconds 8
          Get-Service UsageControl | Format-Table Name, Status
          Save-Menu menu-paused

          # Commits them to the PR branch, for the PR comment.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 origin $env:GITHUB_HEAD_REF
          git checkout -B shots FETCH_HEAD
          New-Item -ItemType Directory pr-screenshots -Force | Out-Null
          Copy-Item shots\*.png pr-screenshots\
          git add pr-screenshots
          git commit -m 'Screenshots of the tray icon (removed before merge)'
          git push origin "HEAD:$env:GITHUB_HEAD_REF"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usage-control-${{ env.VERSION }}-windows
          path: msi/*.msi
          retention-days: 14

  release:
    name: Attach the installers to the release
    if: github.ref_type == 'tag'
    needs: [programs, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: usage-control-${{ needs.programs.outputs.version }}-windows
          path: msi

      # Creates the release for the tag if there is none yet (the other
      # release workflows may at the same time), then adds the installers,
      # replacing ones from an earlier run of the same tag.
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes || gh release view "$GITHUB_REF_NAME" > /dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" msi/*.msi --clobber
