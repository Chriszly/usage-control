name: Windows installer

# Builds the Windows programs (the service and the tray icon) and runs the
# Windows-only tests on every pull request. The installers
# (usage-control-<version>-x64.msi and -arm64.msi) are built on main, on
# version tags, and on pull requests that change the installer or the tray
# icon (windows/, this workflow, backend/cmd/usage-control-tray or
# backend/cmd/tray-icons); that job also checks on a Windows machine that the
# x64 one installs, starts the service and the tray icon and keeps its options
# across an update (windows/check-installer.ps1). Main keeps the installers as
# a workflow artifact; a version tag (v1.2.3 or 1.2.3) also attaches them to
# that GitHub release.
on:
  pull_request:
  push:
    branches:
      - main
    # A release tag, with or without the v: v1.2.3 or 1.2.3.
    tags:
      - 'v*.*.*'
      - '[0-9]*.[0-9]*.[0-9]*'
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  # Only cancel superseded PR runs; let pushes to main and tags finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Go cross-compiles for Windows, so the website and the programs are built on
  # Linux, which is faster than on a Windows runner.
  programs:
    name: Windows programs (x64 and arm64)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      msi_version: ${{ steps.version.outputs.msi_version }}
      installer: ${{ steps.changes.outputs.installer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as a merge commit; its first parent
          # is the base branch, so the PR's changes are the diff to HEAD^1.
          fetch-depth: 2

      # Pull requests only build the installers when they change them or the
      # tray icon they install.
      - name: Does this change the installer
        id: changes
        run: |
          set -euo pipefail
          installer=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] &&
            ! git diff --name-only HEAD^1 HEAD | grep -qE '^(windows/|\.github/workflows/windows\.yml$|backend/cmd/(usage-control-tray|tray-icons)/)'; then
            installer=false
          fi
          echo "installer=$installer" >> "$GITHUB_OUTPUT"

      # A tag v1.2.3 builds version 1.2.3; anything else 0.0.<run number>, so
      # every newer build can be installed over an older one. An installer's
      # version holds only numbers, so the letters of a bugfix release become
      # a fourth number: 1.2.3a is 1.2.3.1, 1.2.3z is 1.2.3.26, 1.2.3aa 1.2.3.27.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)([a-z]*)$ ]]; then
              echo "Tag $GITHUB_REF_NAME is not a version the installer accepts; use v<major>.<minor>.<patch>, such as v1.2.3, with letters for bugfixes, such as 1.2.3a (the v is optional)." >&2
              exit 1
            fi
            msi_version="${BASH_REMATCH[1]}"
            letters="${BASH_REMATCH[2]}"
            if [[ -n "$letters" ]]; then
              number=0
              for ((i = 0; i < ${#letters}; i++)); do
                code="$(printf '%d' "'${letters:i:1}")"
                number=$((number * 26 + code - 96))
              done
              msi_version+=".$number"
            fi
          else
            version="0.0.$GITHUB_RUN_NUMBER"
            msi_version="$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "msi_version=$msi_version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Writes the website into backend/internal/web/files/build, which the
      # programs embed for the installer's WEBSITE=1 option.
      - name: Build the website
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The tray icon is the website's mascot in the colors of the theme just
      # built; the plain one is the installer's icon.
      - name: Draw the tray icons
        working-directory: backend
        run: |
          set -euo pipefail
          go run ./cmd/tray-icons
          mkdir -p ../dist
          cp cmd/usage-control-tray/icons/usage-control.ico ../dist/

      # The tray program is a windowless GUI program, so no console opens with
      # it. The test program runs the Windows-only tests on the Windows runner.
      - name: Build the programs
        working-directory: backend
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" \
              go build -trimpath \
                -ldflags="-s -w -X github.com/Chriszly/usage-control/backend/internal/version.Version=$VERSION" \
                -o "../dist/$arch/usage-control.exe" ./cmd/usage-control
            # Every add-on; the installer picks the ones that work on Windows.
            for cmd in cmd/usage-control-*/; do
              name="$(basename "$cmd")"
              [[ $name == usage-control-tray ]] && continue
              CGO_ENABLED=0 GOOS=windows GOARCH="$arch" \
                go build -trimpath -ldflags="-s -w" -o "../dist/$arch/addons/$name.exe" "./$cmd"
            done
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -H=windowsgui" \
                -o "../dist/$arch/usage-control-tray.exe" ./cmd/usage-control-tray
          done
          GOOS=windows GOARCH=amd64 go test -c -o ../dist/tests/usage-control-tests.exe ./cmd/usage-control
          GOOS=windows GOARCH=amd64 go test -c -o ../dist/tests/metrics-tests.exe ./internal/metrics
          GOOS=windows GOARCH=amd64 go test -c -o ../dist/tests/winservice-tests.exe ./internal/winservice
          GOOS=windows GOARCH=amd64 go test -c -o ../dist/tests/power-tests.exe ./internal/addons/power
          GOOS=windows GOARCH=amd64 go test -c -o ../dist/tests/pressure-tests.exe ./internal/addons/pressure
          GOOS=windows GOARCH=amd64 go test -c -o ../dist/tests/kernel-tests.exe ./internal/addons/kernel

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-programs
          path: dist/
          retention-days: 1

  tests:
    name: Windows tests
    needs: programs
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-programs
          path: dist

      - name: Run the Windows-only tests
        run: |
          # Quoted: PowerShell would split -test.v into -test and .v.
          dist\tests\usage-control-tests.exe '-test.v'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Only the GPU tests: the other metrics tests assume Linux paths.
          dist\tests\metrics-tests.exe '-test.v' '-test.run=GPU'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dist\tests\winservice-tests.exe '-test.v'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Only the Windows reading: the other power tests are the same on Linux.
          dist\tests\power-tests.exe '-test.v' '-test.run=Windows'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dist\tests\pressure-tests.exe '-test.v'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dist\tests\kernel-tests.exe '-test.v'
          if ($LASTEXITCODE -ne 0) { exit 1 }

  installer:
    name: Windows installer (x64 and arm64)
    needs: [programs, tests]
    if: needs.programs.outputs.installer == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.programs.outputs.version }}
      MSI_VERSION: ${{ needs.programs.outputs.msi_version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-programs
          path: dist

      # WiX 5 is the last WiX release under the MS-RL license; later versions
      # need the Open Source Maintenance Fee EULA accepted.
      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.Firewall.wixext/5.0.2 WixToolset.Util.wixext/5.0.2 WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build the installers
        run: |
          foreach ($arch in @{ x64 = 'amd64'; arm64 = 'arm64' }.GetEnumerator()) {
            wix build windows\usage-control.wxs -arch $arch.Key `
              -d Version=$env:MSI_VERSION -d Binary=dist\$($arch.Value)\usage-control.exe `
              -d TrayBinary=dist\$($arch.Value)\usage-control-tray.exe -d AddOns=dist\$($arch.Value)\addons `
              -d Icon=dist\usage-control.ico `
              -ext WixToolset.Firewall.wixext -ext WixToolset.Util.wixext -ext WixToolset.UI.wixext `
              -o "msi\usage-control-$env:VERSION-$($arch.Key).msi"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Get-ChildItem msi

      # The check updates to a newer version, so it also gets an installer
      # with the next bugfix version, which is not published. A bugfix only
      # changes the fourth number, which Windows Installer leaves out when it
      # compares versions, so this also checks that it still replaces the old one.
      - name: Install, update and uninstall it
        run: |
          $version = [version]$env:MSI_VERSION
          $newer = "$($version.Major).$($version.Minor).$($version.Build).$([Math]::Max($version.Revision, 0) + 1)"
          wix build windows\usage-control.wxs -arch x64 `
            -d Version=$newer -d Binary=dist\amd64\usage-control.exe `
            -d TrayBinary=dist\amd64\usage-control-tray.exe -d AddOns=dist\amd64\addons `
            -d Icon=dist\usage-control.ico `
            -ext WixToolset.Firewall.wixext -ext WixToolset.Util.wixext -ext WixToolset.UI.wixext `
            -o "check\usage-control-$newer-x64.msi"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          windows\check-installer.ps1 -Msi "msi\usage-control-$env:VERSION-x64.msi" -NewerMsi "check\usage-control-$newer-x64.msi"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usage-control-${{ env.VERSION }}-windows
          path: msi/*.msi
          retention-days: 14

  release:
    name: Attach the installers to the release
    if: github.ref_type == 'tag'
    needs: [programs, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: usage-control-${{ needs.programs.outputs.version }}-windows
          path: msi

      # Creates the release for the tag if there is none yet (the other
      # release workflows may at the same time), then adds the installers,
      # replacing ones from an earlier run of the same tag.
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes || gh release view "$GITHUB_REF_NAME" > /dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" msi/*.msi --clobber
