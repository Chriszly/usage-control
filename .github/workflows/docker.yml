name: Docker image

# Builds the image for arm64 (Raspberry Pi) and amd64 and publishes it to the GitHub
# Container Registry as ghcr.io/<owner>/usage-control when a pull request is merged
# into main or a version tag (v1.2.3 or 1.2.3) is pushed. Pull requests only build it, in the
# CI workflow's "Docker image (arm64 and amd64)" job.
on:
  push:
    branches:
      - main
    # A release tag, with or without the v: v1.2.3 or 1.2.3.
    tags:
      - 'v*.*.*'
      - '[0-9]*.[0-9]*.[0-9]*'
    # Docs-only changes don't change the image.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  # Let every publishing run finish.
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish (arm64 and amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # main publishes :main, a tag v1.2.3 publishes :1.2.3, :1.2 and :latest,
      # and every published image also gets :sha-<commit>.
      - name: Image names and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # The version the program reports: 1.2.3 for a tag v1.2.3, otherwise the
      # branch and commit, such as main-1a2b3c4.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$GITHUB_REF_NAME-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The final stage only copies the binary, so arm64 needs no emulation.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Names the published images in the notes of the tag's GitHub release, so the
  # release page says how to run it with Docker next to the Windows installers.
  release-notes:
    name: Name the images in the release notes
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add the images to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          image="ghcr.io/${REPOSITORY,,}"
          # The Windows workflow may create the release at the same time.
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --verify-tag --generate-notes || gh release view "$tag" > /dev/null
          fi
          notes="$(gh release view "$tag" --json body --jq .body)"
          marker="<!-- docker-images -->"
          if [[ "$notes" == *"$marker"* ]]; then
            echo "The release notes already name the images."
            exit 0
          fi
          cat > notes.md <<NOTES
          $notes

          $marker
          ## Docker (Linux, Raspberry Pi)

          Images for arm64 and amd64: \`$image:$version\` (also \`:latest\`).

          Update with \`docker compose pull && docker compose up -d\` in the folder with \`compose.yaml\`.
          NOTES
          gh release edit "$tag" --notes-file notes.md
