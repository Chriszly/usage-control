name: Docker image

# Builds the image for arm64 (Raspberry Pi) and amd64 and publishes it to the GitHub
# Container Registry as ghcr.io/<owner>/usage-control when a pull request is merged
# into main or a version tag (v1.2.3 or 1.2.3, or a bugfix such as 1.2.3a) is pushed.
# Pull requests only build it, in the CI workflow's "Docker image (arm64 and amd64)" job,
# which also starts the amd64 image with two add-on containers.
on:
  push:
    branches:
      - main
    # A release tag, with or without the v: v1.2.3 or 1.2.3, or a bugfix 1.2.3a.
    tags:
      - 'v*.*.*'
      - '[0-9]*.[0-9]*.[0-9]*'
    # Docs-only changes don't change the image.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  # Let every publishing run finish.
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish (arm64 and amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The version the program reports: 1.2.3 for a tag v1.2.3, otherwise the
      # branch and commit, such as main-1a2b3c4. A tag that is no release
      # version, such as a pre-release v1.2.3-rc1, fails here, before anything
      # is published: the image names and the Windows installer have no place
      # for it.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+[a-z]*$ ]]; then
              echo "Tag $GITHUB_REF_NAME is not a release version; use v<major>.<minor>.<patch>, such as v1.2.3, with letters for bugfixes, such as 1.2.3a (the v is optional). Pre-release tags such as v1.2.3-rc1 are not supported." >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "version=$GITHUB_REF_NAME-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # main publishes :main, a tag v1.2.3 publishes :1.2.3, :1.2 and :latest,
      # and every published image also gets :sha-<commit>. A bugfix tag such as
      # 1.2.3a is not semver, so the tags are matched by pattern instead.
      - name: Image names and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=match,pattern=^v?(\d+\.\d+\.\d+[a-z]*)$,group=1
            type=match,pattern=^v?(\d+\.\d+)\.\d+[a-z]*$,group=1
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,format=short

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The final stage only copies the binary, so arm64 needs no emulation.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Names the published images in the notes of the tag's GitHub release, so the
  # release page says how to run it with Docker next to the Windows installers.
  release-notes:
    name: Name the images in the release notes
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add the images to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          image="ghcr.io/${REPOSITORY,,}"
          # The Windows workflow may create the release at the same time.
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --verify-tag --generate-notes || gh release view "$tag" > /dev/null
          fi
          notes="$(gh release view "$tag" --json body --jq .body)"
          marker="<!-- docker-images -->"
          if [[ "$notes" == *"$marker"* ]]; then
            echo "The release notes already name the images."
            exit 0
          fi
          cat > notes.md <<NOTES
          $notes

          $marker
          ## Docker (Linux, Raspberry Pi)

          Images for arm64 and amd64: \`$image:$version\` (also \`:latest\`).

          Update with \`docker compose pull && docker compose up -d\` in the folder with \`compose.yaml\`.
          NOTES
          gh release edit "$tag" --notes-file notes.md
