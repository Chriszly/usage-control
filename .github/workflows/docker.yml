name: Docker image

# Builds the image for arm64 (Raspberry Pi) and amd64 and publishes it to the GitHub
# Container Registry as ghcr.io/<owner>/usage-control when a pull request is merged
# into main or a version tag (v1.2.3) is pushed. Pull requests only build it, in the
# CI workflow's "Docker image (arm64 and amd64)" job.
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    # Docs-only changes don't change the image.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  # Let every publishing run finish.
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish (arm64 and amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # main publishes :main, a tag v1.2.3 publishes :1.2.3, :1.2 and :latest,
      # and every published image also gets :sha-<commit>.
      - name: Image names and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The final stage only copies the binary, so arm64 needs no emulation.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
