name: CI

# Pull requests always run this workflow: "Lint and secret check" is a required
# check on main, and the secret check covers docs too. Pushes to main skip changes
# that cannot break anything checked here.
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs; let pushes to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint and secret check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No settings, keys or passwords committed
        run: bash ci/check-no-secrets.sh

      # shellcheck ships with the hosted runner image.
      - name: Check shell scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          for f in "${scripts[@]}"; do bash -n "$f"; done
          shellcheck --color=never "${scripts[@]}"

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12 -no-color -oneline

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "Run gofmt -w on these files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend

      - name: Test
        run: go test ./...

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      # Only reports vulnerabilities in code the backend actually calls.
      - name: Check dependencies for known vulnerabilities
        run: go tool govulncheck ./...

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Check dependencies for known vulnerabilities
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image (arm64 and amd64)
    # Merges to main build and publish the image in the Docker image workflow.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds both architectures without pushing, to catch a broken image before merge.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
