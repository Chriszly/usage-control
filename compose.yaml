# Runs usage-control on a Linux machine, such as a Raspberry Pi:
#   cp .env.example .env   # optional, to change settings
#   docker compose pull && docker compose up -d   # the published image
#   docker compose up -d --build                  # or build it from this checkout
# Then open http://<the machine's address>:8080 from the local network.
services:
  usage-control:
    build: .
    image: ghcr.io/chriszly/usage-control:${IMAGE_TAG:-main}
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Read the host's usage instead of the container's.
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      # Disks to show, by path inside the container. "/" is the disk Docker
      # keeps its data on, usually the system disk. To add another disk, mount
      # a folder on it below at the same path and add that path to DISK_PATHS.
      DISK_PATHS: ${DISK_PATHS:-/}
      # Days of history to keep; older values are deleted automatically.
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      # How the page names this device, and the other devices it collects
      # from in hub mode; see .env.example.
      DEVICE_NAME: ${DEVICE_NAME:-}
      HUB_DEVICES: ${HUB_DEVICES:-}
    volumes:
      # The history database. Kept when the container is updated or recreated.
      - data:/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # For example a USB disk mounted at /mnt/usb on the host:
      # - /mnt/usb:/mnt/usb:ro
    # The site only reads hardware data, so it needs no privileges.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
