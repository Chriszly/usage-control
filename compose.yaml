# Runs usage-control on a Linux machine, such as a Raspberry Pi:
#   cp .env.example .env   # optional, to change settings
#   docker compose pull && docker compose up -d   # the published image
#   docker compose up -d --build                  # or build it from this checkout
# Add-ons are picked with COMPOSE_PROFILES in .env, such as COMPOSE_PROFILES=power or
# COMPOSE_PROFILES=power,memory. COMPOSE_PROFILES=cub starts the lightweight ones
# (the Cub edition); Grizzly is cub with others, such as COMPOSE_PROFILES=cub,power.
# Then open http://<the machine's address>:9393 from the local network.
services:
  usage-control:
    build: .
    image: ghcr.io/chriszly/usage-control:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Published over IPv4 only. The program refuses requests from outside the
    # local network by the client's address, and Docker's proxy would hand
    # IPv6 connections over from its own internal address instead; browsers
    # that try IPv6 first fall back to IPv4 on their own.
    ports:
      - "0.0.0.0:${PORT:-9393}:9393"
    environment:
      # The port the page is reachable on from the network, which a hub tells
      # the devices it collects from so they can link back to it.
      PUBLIC_PORT: ${PORT:-9393}
      # Read the host's usage instead of the container's.
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      # Disks to show, by path inside the container. "/" is the disk Docker
      # keeps its data on, usually the system disk. To add another disk, mount
      # a folder on it below at the same path and add that path to DISK_PATHS.
      DISK_PATHS: ${DISK_PATHS:-/}
      # Days of history to keep; older values are deleted automatically.
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      # How many disks, sensors, network cards and GPUs each the history keeps
      # per device (default 64).
      HISTORY_MAX_ENTRIES: ${HISTORY_MAX_ENTRIES:-}
      # How the page names this device, and the other devices it collects
      # from in hub mode; see .env.example.
      DEVICE_NAME: ${DEVICE_NAME:-}
      HUB_DEVICES: ${HUB_DEVICES:-}
      RESET_PASSWORD: ${RESET_PASSWORD:-}
      # true serves only the usage data for a hub, without the website and
      # history; see .env.example.
      DATA_ONLY: ${DATA_ONLY:-}
      # With DATA_ONLY, hours of usage kept for a hub that cannot reach this
      # device (default 24); see .env.example.
      BUFFER_HOURS: ${BUFFER_HOURS:-}
      # false stops the daily check for a newer release; see .env.example.
      UPDATE_CHECK: ${UPDATE_CHECK:-}
      # Names the page may be opened by besides the IP address and .local
      # names, such as one from the router's DNS; see .env.example.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      # Where the add-ons below write what they read.
      ADDONS_DIR: /addons
    volumes:
      # The history database, or with DATA_ONLY the usage kept for the hub.
      # Kept when the container is updated or recreated.
      - data:/data
      - addons:/addons:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Shows the host's time zone on the page instead of UTC.
      - /etc/localtime:/etc/localtime:ro
      # For example a USB disk mounted at /mnt/usb on the host:
      # - /mnt/usb:/mnt/usb:ro
    # The site only reads hardware data, so it needs no privileges.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The power add-on, started with COMPOSE_PROFILES=power: reads the power
  # Intel and AMD CPUs (RAPL) and the kernel's hwmon sensors report. It runs
  # as root, as newer kernels let only root read the CPU's energy counters,
  # but without any capability and without network. A Raspberry Pi 5's total
  # and NVIDIA GPUs need vcgencmd and nvidia-smi, which only the Linux archive
  # reaches (see docs/setup.md).
  power:
    image: ghcr.io/chriszly/usage-control:${IMAGE_TAG:-latest}
    profiles: [power]
    restart: unless-stopped
    entrypoint: ["/usage-control-power"]
    user: "0:0"
    environment:
      HOST_SYS: /host/sys
      ADDONS_DIR: /addons
    volumes:
      - addons:/addons
      - /sys:/host/sys:ro
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The pressure add-on, started with COMPOSE_PROFILES=pressure: reads from
  # the host's /proc/pressure how much of the time tasks waited for the CPU,
  # memory and disks. Reading needs no privileges, so it runs as the image's
  # user, like usage-control, without any capability and without network.
  # All of /proc is mounted, not only /proc/pressure, which a kernel with PSI
  # switched off (as on Raspberry Pi OS) does not have: Docker could not
  # mount it, and the container would not start.
  pressure:
    image: ghcr.io/chriszly/usage-control:${IMAGE_TAG:-latest}
    profiles: [pressure, cub]
    restart: unless-stopped
    entrypoint: ["/usage-control-pressure"]
    environment:
      HOST_PROC: /host/proc
      ADDONS_DIR: /addons
    volumes:
      - addons:/addons
      - /proc:/host/proc:ro
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The kernel add-on, started with COMPOSE_PROFILES=kernel: reads context
  # switches, interrupts, new processes and threads, open files, sockets,
  # established TCP connections and retransmissions from the host's /proc. The
  # network values come from /host/proc/1/net, the host's init's network, not
  # the container's. Every user may read those files, so it runs as the
  # image's user, like usage-control, without any capability or network.
  kernel:
    image: ghcr.io/chriszly/usage-control:${IMAGE_TAG:-latest}
    profiles: [kernel, cub]
    restart: unless-stopped
    entrypoint: ["/usage-control-kernel"]
    environment:
      HOST_PROC: /host/proc
      ADDONS_DIR: /addons
    volumes:
      - addons:/addons
      - /proc:/host/proc:ro
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The Wi-Fi add-on, started with COMPOSE_PROFILES=wifi: reads the link
  # quality and signal of each connected Wi-Fi interface from the host's
  # /proc/1/net/wireless, which anyone may read, so it runs as the image's
  # user, like usage-control, without any capability and without network.
  wifi:
    image: ghcr.io/chriszly/usage-control:${IMAGE_TAG:-latest}
    profiles: [wifi, cub]
    restart: unless-stopped
    entrypoint: ["/usage-control-wifi"]
    environment:
      HOST_PROC: /host/proc
      ADDONS_DIR: /addons
    volumes:
      - addons:/addons
      - /proc:/host/proc:ro
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The memory add-on, started with COMPOSE_PROFILES=memory: reads memory
  # details from the host's /proc, such as dirty and slab memory, page faults
  # and swapping per second. Reading needs no privilege, so it runs as the
  # image's user, like usage-control, without any capability or network.
  memory:
    image: ghcr.io/chriszly/usage-control:${IMAGE_TAG:-latest}
    profiles: [memory, cub]
    restart: unless-stopped
    entrypoint: ["/usage-control-memory"]
    environment:
      HOST_PROC: /host/proc
      ADDONS_DIR: /addons
    volumes:
      - addons:/addons
      - /proc:/host/proc:ro
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The ports add-on, started with COMPOSE_PROFILES=ports: lists the TCP and
  # UDP ports the host listens on, from the host's /proc, which anyone may
  # read, so it runs as the image's user, like usage-control, without any
  # capability and without network.
  ports:
    image: ghcr.io/chriszly/usage-control:${IMAGE_TAG:-latest}
    profiles: [ports]
    restart: unless-stopped
    entrypoint: ["/usage-control-ports"]
    environment:
      HOST_PROC: /host/proc
      ADDONS_DIR: /addons
    volumes:
      - addons:/addons
      - /proc:/host/proc:ro
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The containers add-on, started with COMPOSE_PROFILES=containers: reads
  # the CPU and memory of each running container from the host's cgroups
  # (v2), never through the Docker socket. It runs as root in its container,
  # as only root may read the containers' names in Docker's data folder, but
  # without any capability, without network and with both mounts read-only.
  containers:
    image: ghcr.io/chriszly/usage-control:${IMAGE_TAG:-latest}
    profiles: [containers]
    restart: unless-stopped
    entrypoint: ["/usage-control-containers"]
    user: "0:0"
    environment:
      HOST_SYS: /host/sys
      ADDONS_DIR: /addons
      DOCKER_DIR: /host/docker
    volumes:
      - addons:/addons
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      # The containers' settings, for their names, from Docker's data folder
      # (DOCKER_DIR in .env). Compose does not create the folder where it is
      # missing, so the host stays as it is.
      - type: bind
        source: ${DOCKER_DIR:-/var/lib/docker}/containers
        target: /host/docker/containers
        read_only: true
        bind:
          create_host_path: false
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The processes add-on, started with COMPOSE_PROFILES=processes: lists the
  # processes using the most CPU and memory from the host's /proc. The files
  # it reads every user may read, so it runs as the image's user, like
  # usage-control, without any capability or network.
  processes:
    image: ghcr.io/chriszly/usage-control:${IMAGE_TAG:-latest}
    profiles: [processes]
    restart: unless-stopped
    entrypoint: ["/usage-control-processes"]
    environment:
      HOST_PROC: /host/proc
      ADDONS_DIR: /addons
    volumes:
      - addons:/addons
      - /proc:/host/proc:ro
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
  # In memory only: the add-ons' newest values. The add-ons that run as the
  # image's user can write here because a new tmpfs is open to everyone
  # (mode 1777, like /tmp); setting o: mode=... here would make Compose refuse
  # the volume that already exists on machines set up before.
  addons:
    driver_opts:
      type: tmpfs
      device: tmpfs
