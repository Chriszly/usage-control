@if (devices.devices().length > 1) {
  <div class="choices" role="group" [attr.aria-label]="i18n.t('devices.label')">
    @for (device of devices.devices(); track device.id) {
      <button
        type="button"
        [attr.aria-pressed]="device.id === devices.selectedId()"
        [title]="status(device)"
        (click)="devices.selectedId.set(device.id)"
      >
        <span class="status" [class.unreachable]="device.unreachable" aria-hidden="true"></span>
        {{ deviceName(device) }}
        @if (device.unreachable) {
          <span class="visually-hidden">({{ i18n.t('devices.unreachable') }})</span>
        }
      </button>
    }
  </div>
}
<button mat-stroked-button type="button" class="manage" (click)="openDevices()">
  {{ i18n.t(devices.devices().length > 1 ? 'devices.manage' : 'devices.addOther') }}
</button>
