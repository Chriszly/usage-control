@if (status(); as s) {
  @if (s.latest && s.url) {
    <p class="notice" role="status">
      {{ i18n.t('update.available', { latest: s.latest, current: s.current }) }}
      <a [href]="s.url" target="_blank" rel="noopener noreferrer">{{
        i18n.t('update.whatsNew')
      }}</a>
    </p>
  }
}
